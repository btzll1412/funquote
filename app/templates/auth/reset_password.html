{% extends "base.html" %}
{% block title %}Reset password — FunQuote{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Set a new password</h1>
  <div class="help">
    <strong>Almost done</strong> — choose a new password for
    <span class="mono">{{ email }}</span> (at least 8 characters), then log in with it.
  </div>
  <form method="post" action="/reset-password/{{ token }}">
    <label>New password
      <input name="password" type="password" minlength="8" required autofocus></label>
    <button class="btn btn-primary">Set new password</button>
  </form>
</div>
{% endblock %}
