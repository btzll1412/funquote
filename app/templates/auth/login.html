{% extends "base.html" %}
{% block title %}Log in — FunQuote{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Log in</h1>
  <form method="post" action="/login">
    <label>Email
      <input name="email" type="email" required value="{{ email or '' }}"></label>
    <label>Password
      <input name="password" type="password" required></label>
    <button class="btn btn-primary">Log in</button>
  </form>
  <p class="muted"><a href="/forgot-password">Forgot your password?</a></p>
  <p class="muted">New here? <a href="/signup">Create an organization</a></p>
</div>
{% endblock %}
